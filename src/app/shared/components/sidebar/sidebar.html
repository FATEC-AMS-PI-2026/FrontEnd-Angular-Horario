<aside class="sidebar">

  <!-- LOGO CPS -->
  <div class="sidebar__header">
    <div class="logo-box">
      <img src="/auth/cps-logo.png" alt="CPS" />
    </div>
  </div>

  <!-- PERFIL -->
  <div class="sidebar__profile">
    <div class="avatar">
      <app-figma-icon name="avatar" />
    </div>
    <div class="info">
      <strong>{{ session.usuario()?.nome || 'Visitante' }}</strong>
      <span [title]="session.identificacao()">{{ session.identificacao() }}</span>
    </div>
  </div>

  <!-- NAVEGAÇÃO -->
  <nav class="sidebar__nav">
    @for (link of links; track link.path) {
    <a class="sidebar__link" [routerLink]="link.path" [attr.aria-label]="link.label" routerLinkActive="sidebar__link--active">

      <!-- Ícones dinâmicos -->
      <span class="icon">
        <app-figma-icon [name]="link.icon" />
      </span>
      <span class="sidebar__label">{{ link.label }}</span>
    </a>
    }
  </nav>

  <!-- RODAPÉ (SAIR) -->
  <div class="sidebar__footer">
    <button type="button" class="sidebar__link sidebar__link--logout" aria-label="Sair" (click)="logout()">
      <span class="icon">
        <app-figma-icon name="logout-nav" />
      </span>
      <span class="sidebar__label">Sair</span>
    </button>
  </div>

</aside>
