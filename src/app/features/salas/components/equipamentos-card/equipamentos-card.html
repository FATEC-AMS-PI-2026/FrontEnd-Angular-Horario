<section class="equipamentos-card" [class.equipamentos-card--compacto]="compacto()" aria-label="Equipamentos">
  @if (!compacto()) { <h2>Equipamentos</h2> }
  <ul>
    @for (linha of linhas(); track linha.tipo) {
      <li>
        <span class="equipamento__nome"><img [src]="'/icons/salas/' + linha.icone + '.png'" alt="" />{{ linha.nome }}</span>
        <span class="equipamento__quantidade" [class.equipamento__quantidade--total]="linha.dado && linha.dado.quantidadeDisponivel >= linha.dado.quantidadeTotal"
          [class.equipamento__quantidade--parcial]="linha.dado && linha.dado.quantidadeDisponivel > 0 && linha.dado.quantidadeDisponivel < linha.dado.quantidadeTotal"
          [class.equipamento__quantidade--indisponivel]="linha.dado?.quantidadeDisponivel === 0"
          [attr.aria-label]="linha.dado ? linha.dado.quantidadeDisponivel + ' de ' + linha.dado.quantidadeTotal + ' disponíveis' : linha.nome + ': informação não disponível'">
          @if (linha.dado; as dado) { {{ dado.quantidadeDisponivel }}/{{ dado.quantidadeTotal }} }
        </span>
      </li>
    }
  </ul>
</section>
