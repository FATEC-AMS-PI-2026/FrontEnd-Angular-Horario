<section class="tecnico-card" aria-labelledby="titulo-tecnico-card">
  <h2 id="titulo-tecnico-card">Técnico responsável</h2>
  <div class="tecnico-card__pessoa">
    <span class="tecnico-card__avatar" aria-hidden="true">{{ iniciais() }}</span>
    <div><strong>{{ tecnico()?.nome }}</strong><p>{{ tecnico()?.funcao }}</p></div>
  </div>
  <p class="tecnico-card__horario">Horário: <strong>{{ tecnico()?.horarioAtendimento }}</strong> <span>{{ tecnico()?.diasAtendimento }}</span></p>
</section>
