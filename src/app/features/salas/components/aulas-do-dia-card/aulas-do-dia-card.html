<section class="aulas-do-dia-card">
  <h2>Aulas nesta sala hoje</h2>
  <ul>
    @for (aula of aulasOrdenadas(); track $index) {
      <li class="aula-do-dia" [class.aula-do-dia--agora]="estaEmAndamento(aula)">
        <span class="aula-do-dia__horario"><span>{{ aula.inicio }}</span><span>{{ aula.termino }}</span></span>
        <div class="aula-do-dia__conteudo"><strong>{{ aula.disciplina }}</strong><p>{{ aula.professor }}@if (aula.professor && aula.turma) { · }{{ aula.turma }}</p></div>
        @if (estaEmAndamento(aula)) { <span class="aula-do-dia__badge">Agora</span> }
      </li>
    } @empty { <li class="aulas-do-dia-card__vazio" aria-label="Sem aulas disponíveis para hoje"></li> }
  </ul>
</section>
