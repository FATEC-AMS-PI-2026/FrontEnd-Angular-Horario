<div class="cabecalho-sala">
  <app-icone-sala [nome]="sala().nome" [tipo]="sala().tipo" />
  <div class="cabecalho-sala__conteudo">
    <h2>{{ sala().tipo || sala().nome }}@if (sala().tipo) { <span class="cabecalho-sala__codigo">{{ sala().nome }}</span> }</h2>
    <div class="cabecalho-sala__badges">
      @if (sala().predio) { <span class="cabecalho-sala__badge">{{ sala().predio }}</span> }
      @if (sala().andar !== undefined) { <span class="cabecalho-sala__badge">Andar: <span>{{ sala().andar }}</span></span> }
      @if (disponibilidade()?.status; as status) {
        <app-status-sala-badge [status]="status" [texto]="disponibilidade()?.texto" />
      } @else { <span class="cabecalho-sala__status-vazio" aria-label="Status não informado"></span> }
    </div>
    <div class="cabecalho-sala__resumo">
      <span>Capacidade de alunos: <strong>{{ sala().capacidade }}</strong></span>
    </div>
  </div>
  <a class="cabecalho-sala__voltar" routerLink="/salas">Voltar</a>
</div>
