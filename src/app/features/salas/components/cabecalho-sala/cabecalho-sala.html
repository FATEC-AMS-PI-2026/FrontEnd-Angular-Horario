<a class="cabecalho-sala__voltar" routerLink="/salas">← Voltar para a lista de salas</a>
<nav class="cabecalho-sala__breadcrumb" aria-label="Você está em">
  <a routerLink="/salas">Salas</a>
  <span aria-hidden="true">/</span>
  <span>{{ sala().nome }}</span>
</nav>
<div class="cabecalho-sala__topo"><h1>{{ sala().nome }}</h1></div>
<div class="cabecalho-sala__badges">
  @if (disponibilidade(); as disponibilidade) {
    @if (disponibilidade.status; as status) {
      <app-status-sala-badge [status]="status" [texto]="disponibilidade.texto" />
    } @else {
      <span role="status">{{ disponibilidade.texto }}</span>
    }
  }
  <span class="cabecalho-sala__badge">{{ sala().tipo }}</span>
</div>
<dl class="cabecalho-sala__resumo">
  <div><dt>Capacidade</dt><dd>{{ sala().capacidade }} pessoas</dd></div>
</dl>
