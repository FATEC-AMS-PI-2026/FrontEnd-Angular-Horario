<section class="tecnico-card" aria-labelledby="titulo-tecnico-card">
  <h2 id="titulo-tecnico-card">Técnico responsável</h2>
  <dl class="tecnico-card__info">
    <div>
      <dt>Nome</dt>
      <dd>{{ tecnico().nome }}</dd>
    </div>
    <div>
      <dt>Função</dt>
      <dd>{{ tecnico().funcao }}</dd>
    </div>
    <div>
      <dt>Horário de atendimento</dt>
      <dd>{{ tecnico().horarioAtendimento }}</dd>
    </div>
    <div>
      <dt>Dias de atendimento</dt>
      <dd>{{ tecnico().diasAtendimento }}</dd>
    </div>
  </dl>
</section>
