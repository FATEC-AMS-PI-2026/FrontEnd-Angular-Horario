<div class="page">
  <div class="card">
    <div class="card__image">
      <img src="fatec.png" alt="Fachada da Fatec" class="card__image-img" />
      <img src="cps-logo.png" alt="Centro Paula Souza" class="card__logo" />
    </div>

    <div class="card__form">
      <h1 class="title">Esqueci a minha senha</h1>
      <p class="subtitle">Insira seu email para verificação</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="field">
          <input
            id="email"
            type="email"
            placeholder="Email"
            formControlName="email"
            class="field__input"
            [class.field__input--error]="submitted && email?.invalid"
          />
          <p class="field__error" *ngIf="submitted && email?.invalid">
            <span *ngIf="email?.errors?.['required']">Informe seu e-mail.</span>
            <span *ngIf="email?.errors?.['email']">Informe um e-mail válido.</span>
          </p>
        </div>

        <button type="submit" class="btn" [disabled]="loading">
          {{ loading ? 'Enviando...' : 'Recuperar senha' }}
        </button>

        <p class="message message--success" *ngIf="successMessage">{{ successMessage }}</p>
        <p class="message message--error" *ngIf="errorMessage">{{ errorMessage }}</p>
      </form>
    </div>
  </div>
</div>
